name: ⚡ LOKI CI — Quality, Testing & Chaos Suite

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "CHANGELOG/**"
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "CHANGELOG/**"
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Ruff Linter & Pytest Unit Tests"
        required: false
        default: true
        type: boolean
      full_matrix:
        description: "Run Full 7-Environment Matrix (Ubuntu/Windows/macOS, Python 3.10-3.12)"
        required: false
        default: false
        type: boolean
      run_security:
        description: "Run Dependency Vulnerability Audit (pip-audit)"
        required: false
        default: false
        type: boolean
      run_packaging:
        description: "Run PyInstaller Binary Smoke Test (loki.spec)"
        required: false
        default: false
        type: boolean
      run_chaos:
        description: "Run Playwright Swarm Chaos Gate (Playground)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: 🧭 Detect Affected Scopes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      security: ${{ steps.decide.outputs.security }}
      packaging: ${{ steps.decide.outputs.packaging }}
      chaos: ${{ steps.decide.outputs.chaos }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: 📥 Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: 🔍 Filter modified paths
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '.github/workflows/loki.yml'
            security:
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/loki.yml'
            packaging:
              - 'loki.spec'
              - 'loki_entry.py'
              - 'installer/**'
              - 'assets/logo.ico'
              - 'requirements.txt'
              - 'pyproject.toml'
            chaos:
              - 'src/loki/engine/**'
              - 'src/loki/personas/**'
              - 'src/loki/services/run.py'
              - 'playground/**'
              - '.loki/rules.md'

      - name: 🎯 Resolve execution plan & test matrix
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=${{ inputs.run_tests }}" >> "$GITHUB_OUTPUT"
            echo "security=${{ inputs.run_security }}" >> "$GITHUB_OUTPUT"
            echo "packaging=${{ inputs.run_packaging }}" >> "$GITHUB_OUTPUT"
            echo "chaos=${{ inputs.run_chaos }}" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
            echo "security=${{ steps.filter.outputs.security }}" >> "$GITHUB_OUTPUT"
            echo "packaging=${{ steps.filter.outputs.packaging }}" >> "$GITHUB_OUTPUT"
            echo "chaos=${{ steps.filter.outputs.chaos }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.full_matrix }}" = "true" ]; then
            MATRIX='[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.11"}]'
          else
            MATRIX='[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.11"}]'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  lint:
    name: 🔍 Lint & Code Standards (Ruff)
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check src tests"

  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: 🧪 Run Pytest Test Suite
        run: |
          pytest -v tests/

  security-audit:
    name: 🔒 Security & Vulnerability Audit (pip-audit)
    needs: detect-changes
    if: needs.detect-changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt pip-audit

      - name: 🛡️ Audit full installed dependency tree
        run: |
          pip-audit --desc on

  spec-smoke-test:
    name: 📦 Binary Spec Smoke Test (loki.spec)
    needs: detect-changes
    if: needs.detect-changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: 🔨 Compile binary using optimized loki.spec
        run: |
          pyinstaller --noconfirm --clean loki.spec

      - name: 🧪 Smoke test compiled standalone binary
        run: |
          chmod +x dist/loki
          ./dist/loki --help
          ./dist/loki version

  chaos-gate:
    name: 🌪️ Synthetic Chaos & Rule Verification (Playground)
    needs: [detect-changes, lint, unit-tests]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.chaos == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install -e .
          playwright install --with-deps chromium

      - name: 🚀 Start local testbed web application
        run: |
          python -m http.server 8000 --directory playground &
          sleep 2

      - name: ⚡ Execute LOKI Swarm Chaos Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"
        run: |
          python -m loki.cli run http://localhost:8000 --swarm --duration 6 --ci

      - name: 📦 Archive LOKI Incident Bundles & HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loki-evidence-bundles
          path: .loki/runs/
          retention-days: 14
