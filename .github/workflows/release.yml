name: 🚀 Build Binaries & Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: amd64
            binary_name: loki-windows-amd64.exe
            output_path: dist/loki.exe
          - os: linux
            runner: ubuntu-latest
            arch: amd64
            binary_name: loki-linux-amd64
            output_path: dist/loki
          - os: macos
            runner: macos-latest
            arch: arm64
            binary_name: loki-macos-arm64
            output_path: dist/loki

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Compile Standalone Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --clean loki.spec

      - name: 🔏 Sign Windows Executable & Build Inno Setup Installer
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from loki import __version__; print(__version__)"
          if ($env:WINDOWS_PFX_BASE64) {
            [IO.File]::WriteAllBytes("temp-codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            .\installer\sign_windows.ps1 -FilePath "dist\loki.exe" -PfxPath "temp-codesign.pfx" -Password $env:WINDOWS_PFX_PASSWORD
          }
          iscc "/DMyAppVersion=$version" installer\loki.iss
          if ($env:WINDOWS_PFX_BASE64) {
            .\installer\sign_windows.ps1 -FilePath "dist\loki-setup-windows-amd64.exe" -PfxPath "temp-codesign.pfx" -Password $env:WINDOWS_PFX_PASSWORD
            Remove-Item "temp-codesign.pfx" -Force -ErrorAction SilentlyContinue
          }

      - name: 🏷️ Rename binary for release
        shell: bash
        run: |
          mv ${{ matrix.output_path }} dist/${{ matrix.binary_name }}
          chmod +x dist/${{ matrix.binary_name }} || true

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            dist/${{ matrix.binary_name }}
            dist/loki-setup-windows-amd64.exe

  release:
    name: 📦 Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body_path: CHANGELOG/${{ github.ref_name }}.md

  pypi-publish:
    name: 🐍 Publish Python Package to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 🚀 Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
